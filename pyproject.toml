[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-data-extractors"
version = "1.0.0"
description = "Extract fund disclosures from Next.js AMC sites, XLSX portfolios and PDF factsheets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fund_extract"]

[tool.pytest.ini_options]
pythonpath = ["."]
